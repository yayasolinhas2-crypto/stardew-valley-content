<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Segredos do Valley · Painel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jersey+10&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Visual "site profissional" (08/11, pedido da Yasmin: o antigo parecia infantil).
   Celular: cabeçalho + barra de abas fixa embaixo (como app). Computador (≥ 960px): menu lateral.
   Cada post abre numa página própria (#post-x); fotos em #fotos-x. */
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#faf9f6; --line:#e6e3dc; --line2:#d9d5cc;
  --ink:#1d1c1a; --muted:#6c685f; --faint:#9a958a;
  --accent:#2e6b3f; --accent-ink:#ffffff; --accent-soft:#e6f0e8; --gold:#c98a12; --gold-soft:#fbf1dc;
  --ok:#22713a; --okbg:#e5f3e8; --warn:#9a5b00; --warnbg:#fdf0d8; --bad:#b42318; --badbg:#fde8e6; --info:#1f5fa8; --infobg:#e6eefa;
  --shadow:0 1px 2px rgba(20,18,14,.05),0 4px 14px rgba(20,18,14,.05);
  --r:14px; --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --pix:"Jersey 10","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111210; --surface:#1a1c19; --surface2:#151714; --line:#2a2d28; --line2:#363a34;
  --ink:#ecebe6; --muted:#a4a196; --faint:#7b786f;
  --accent:#6dbb80; --accent-ink:#0f1a12; --accent-soft:#1d2e21; --gold:#e6b04a; --gold-soft:#2e2615;
  --ok:#7dd08f; --okbg:#173020; --warn:#f0bd5c; --warnbg:#33270f; --bad:#ff8b80; --badbg:#3a1714; --info:#8fbaf0; --infobg:#15253a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111210; --surface:#1a1c19; --surface2:#151714; --line:#2a2d28; --line2:#363a34;
  --ink:#ecebe6; --muted:#a4a196; --faint:#7b786f;
  --accent:#6dbb80; --accent-ink:#0f1a12; --accent-soft:#1d2e21; --gold:#e6b04a; --gold-soft:#2e2615;
  --ok:#7dd08f; --okbg:#173020; --warn:#f0bd5c; --warnbg:#33270f; --bad:#ff8b80; --badbg:#3a1714; --info:#8fbaf0; --infobg:#15253a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
a{color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estrutura ---------- */
.app{min-height:100vh}
.side{position:sticky;top:0;z-index:6;background:var(--bg);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:36px;border-radius:10px;display:block;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--faint);font-size:11px;font-weight:600;border-radius:10px;-webkit-tap-highlight-color:transparent}
nav.tabs a svg.i{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs .n{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;font-weight:700;line-height:16px;min-width:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;text-align:center}
.side .who{display:none}
.main{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.phead h1{font-size:24px;letter-spacing:-.02em}
.phead p{color:var(--muted);font-size:14px;margin-top:2px}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .side{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);background:var(--surface2);backdrop-filter:none;padding:22px 14px;display:flex;flex-direction:column;gap:22px}
  .brand{padding:0 8px}
  nav.tabs{position:static;display:flex;flex-direction:column;gap:2px;background:none;backdrop-filter:none;border:0;padding:0}
  nav.tabs a{flex-direction:row;gap:12px;padding:9px 12px;font-size:14px;color:var(--muted)}
  nav.tabs a:hover{background:var(--line);color:var(--ink)}
  nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow)}
  nav.tabs a[aria-current="page"] svg.i{color:var(--accent)}
  nav.tabs .n{position:static;margin-left:auto;font-size:11px;line-height:18px;min-width:20px}
  .side .who{display:block;margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12px;color:var(--muted)}
  .side .who b{display:block;color:var(--ink);font-size:13px}
  .main{padding:34px 40px 60px;width:100%}
  .phead h1{font-size:28px}
}

/* ---------- blocos ---------- */
.view{display:grid;gap:16px}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.hl{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.sect{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13.5px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:99px;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-aguardando{color:var(--warn);background:var(--warnbg)} .s-aprovado{color:var(--ok);background:var(--okbg)}
.s-negado{color:var(--bad);background:var(--badbg)} .s-publicado{color:var(--muted);background:var(--line)}
.s-agendado{color:var(--info);background:var(--infobg)} .s-atrasado{color:var(--bad);background:var(--badbg)}
.tag{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:99px;white-space:nowrap}
.when{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.when svg.i{width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{display:grid;gap:2px;padding:14px 16px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.alerta b{color:var(--warn)}
.mc-aviso{display:block;padding:14px 16px;border-radius:12px;background:var(--badbg);color:var(--bad);font-weight:800;font-size:17px;border:2px solid var(--bad);margin:0 0 10px}
.mc-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mc-linha .t{font-variant-numeric:tabular-nums;font-weight:700}
.mc-linha small{display:block;color:var(--muted);font-weight:500}
.mc-erro{color:var(--bad)} .mc-erro b{color:var(--bad)}
.mc-pend{color:var(--warn);background:var(--warnbg)}

/* botões */
button,.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;
  text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,transform .05s}
button:hover,.btn:hover{background:var(--surface2);border-color:var(--faint)}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ok:hover{background:color-mix(in srgb,var(--ok) 88%,#000)}
:root[data-theme="dark"] .ok{color:#0f1a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ok{color:#0f1a12}}
.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.bad:hover{background:var(--badbg)}
.small{min-height:36px;padding:6px 12px;font-size:13px}
.done{background:var(--okbg);color:var(--ok);border-color:transparent}
button[disabled]{opacity:.5;cursor:default}
.wide{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* passo a passo */
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:s}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
ol.steps>li::before{content:counter(s);font-size:13px;font-weight:700;line-height:28px;text-align:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);height:28px}
ol.steps>li>div{display:grid;gap:8px;min-width:0}
ol.steps b{font-weight:600}
.txt{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere;max-height:9.5em;overflow:auto;color:var(--muted)}
/* mídia */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.strip img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;display:block;background:var(--line);box-shadow:0 0 0 1px var(--line)}
.card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start}
.card img{width:72px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:block;background:var(--line);box-shadow:0 0 0 1px var(--line)}
.card .meta{min-width:0;display:grid;gap:6px}
.card h3{font-size:16px}
.gal{display:grid;gap:18px}
.gal figure{margin:0;display:grid;gap:8px}
.gal img{width:100%;max-width:440px;justify-self:center;aspect-ratio:9/16;border-radius:12px;display:block;background:var(--line);box-shadow:var(--shadow);-webkit-touch-callout:default;user-select:auto}
.gal figcaption{display:flex;justify-content:space-between;align-items:center;max-width:440px;width:100%;justify-self:center;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:block;box-shadow:0 0 0 1px var(--line)}
video.player{width:100%;max-width:260px;justify-self:center;aspect-ratio:9/16;border-radius:14px;background:#000;display:block;box-shadow:var(--shadow)}
/* listas de horários */
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0;padding-top:2px}
.slot .t{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .vago{color:var(--faint);font-size:13.5px}
.slot a{color:var(--ink);text-decoration:none;display:grid;gap:3px;min-width:0;grid-column:2/4}
.slot a b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.slot a:hover b{color:var(--accent)}
.lista .slot{grid-template-columns:44px 1fr}
.lista .slot .num{font-size:12.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.semana{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.hoje-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
/* layouts */
.cards2{display:grid;gap:16px}
@media (min-width:1100px){.cards2{grid-template-columns:1fr 1fr}}
.prox{display:grid;gap:18px}
@media (min-width:860px){.prox{grid-template-columns:minmax(240px,320px) 1fr;align-items:start}.prox video.player{max-width:none}}
.two{display:grid;gap:16px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.back{justify-self:start}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.reasons label{font-size:13px;font-weight:500;border:1px solid var(--line2);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--surface);display:flex;gap:6px;align-items:center}
.reasons label:has(input:checked){background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad)}
.reasons input{accent-color:var(--bad);width:16px;height:16px;margin:0}
textarea{font:inherit;font-size:16px;width:100%;min-height:84px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px 12px}
ul.src{margin:0;padding-left:18px;font-size:13px;overflow-wrap:anywhere} ul.src a{color:var(--info)}
.empty{text-align:center;padding:36px 18px;justify-items:center}
.empty .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:960px){.toast{bottom:24px}}
.grav{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.grav:first-child{border-top:0}
.grav .ok{width:44px;height:44px;padding:0;border-radius:12px}
.grav.feito{align-items:center;color:var(--muted);font-size:13.5px}
details summary{cursor:pointer;padding:6px 0;list-style-position:inside}
.bar{display:grid;gap:4px;font-size:13.5px}
.bar .trk{display:block;height:8px;border-radius:99px;background:var(--line)}
.bar .trk i{display:block;height:100%;border-radius:99px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="side">
    <a class="brand" href="#postar"><img src="marca/avatar.png" alt=""><span><b>Segredos do Valley</b><small id="sync">Painel de conteúdo</small></span></a>
    <nav class="tabs" aria-label="Seções">
      <a href="#postar" data-v="postar"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
      <a href="#aprovar" data-v="aprovar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>Aprovar<span class="n" id="n-aprovar" hidden></span></a>
      <a href="#gravar" data-v="gravar"><svg class="i" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h11A1.5 1.5 0 0 1 17 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16.5z"/><path d="m17 10 4-2.5v9L17 14"/></svg>Gravar<span class="n" id="n-gravar" hidden></span></a>
      <a href="#semana" data-v="semana"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</a>
      <a href="#numeros" data-v="numeros"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M6 17v-5M11 17V7M16 17v-9M21 17V4"/></svg>Números</a>
    </nav>
    <div class="who"><b>@segredosdovalley</b>TikTok + Instagram · agendado pelo Metricool</div>
  </header>
  <main class="main"><div class="phead" id="phead"></div><div class="view" id="view"><div class="frame empty muted">Carregando os posts…</div></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const STATUS={aguardando:"Aguardando você",aprovado:"Aprovado",agendado:"Agendado",negado:"Negado",publicado:"Postado"};
const MOTIVOS=["gancho fraco","erro no texto","visual feio","confuso","bobo","nichado demais","já existe","nada a ver comigo"];
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const DIAS_L=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const ICO={relogio:`<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  ok:`<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>`,cal:`<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`};
let gravar=[],metricas=[],vozes=[],vozEscolhida=null,posts=[],db=null,dl=null,writable=true,loaded=false,busy=false,negando=null,voltarLista="postar",voltarFotos="";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=p=>new Date(`${p.data}T${p.hora||"00:00"}:00-03:00`).getTime();
const dia=d=>{const x=new Date(d+"T12:00:00-03:00");return `${DIAS[x.getUTCDay()]} ${d.slice(8,10)}/${d.slice(5,7)}`};
const diaLongo=d=>{const x=new Date(d+"T12:00:00-03:00");return `${DIAS_L[x.getUTCDay()]}, ${d.slice(8,10)}/${d.slice(5,7)}`};
const hoje=()=>new Date(Date.now()-3*36e5).toISOString().slice(0,10);
const quando=p=>p.data?`${dia(p.data)} · ${esc(p.hora||"")}`:"sem horário";
const atrasado=p=>p.status==="aprovado"&&when(p)<Date.now()-15*6e4;
const saiu=p=>p.status==="agendado"&&when(p)<Date.now()-10*6e4;
const pill=p=>saiu(p)?`<span class="pill s-publicado">Postado</span>`:atrasado(p)?`<span class="pill s-atrasado">Atrasado</span>`:`<span class="pill s-${esc(p.status)}">${esc(STATUS[p.status]||p.status)}</span>`;

  const plano=()=>{const ta=document.createElement("textarea");ta.value=texto;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,texto.length);
    let r=false;try{r=document.execCommand("copy")}catch{}ta.remove();r?ok():toast("Não deu pra copiar sozinho: segure o dedo no texto e copie")};

function slugT(t){return (t||"").replace(/✋.*?·/,"").replace(/·\s*marcar como IA|\(tela cheia\)|ALTERNATIVA\s*·/gi,"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40).replace(/-$/,"")||"post"}
function nomePasta(p){const d=new Date(`${p.data}T${p.hora}:00-03:00`);

  const g=k=>f.find(x=>x.type===k).value;return `${g("year")}-${g("month")}-${g("day")}_${g("hour")}${g("minute")}_${slugT(p.titulo)}`}

  const fim=ag.length?dia(ag.at(-1).data):"—";
  const kpis=`<div class="kpis">
    <a class="kpi${pend?" alerta":""}" href="#aprovar"><span>Aguardando você</span><b>${pend}</b></a>
    <a class="kpi" href="#semana"><span>Agendados</span><b>${ag.length}</b></a>
    <a class="kpi" href="#semana"><span>Agenda cheia até</span><b>${fim}</b></a>
    <div class="kpi"><span>Já postados</span><b>${pub}</b></div></div>`;
  const prox=ag[0];
  const h=hoje();
  const doDia=posts.filter(p=>p.data===h&&p.status!=="negado").sort(byTime);
  const amanha=new Date(new Date(h+"T12:00:00-03:00").getTime()+864e5).toISOString().slice(0,10);
  const doAmanha=posts.filter(p=>p.data===amanha&&p.status!=="negado").sort(byTime);
  const aviso=vozes.length&&!vozEscolhida?`<a class="btn wide" href="#vozes">Teste de voz: escolha a narração dos vídeos →</a>`:"";
  const mao=maoPend();
  const blocoMao=mao.length?`<section class="frame hl"><div class="sect"><h3>✋ Você posta à mão</h3><a class="btn small" href="#mao">Ver todos (${mao.length})</a></div><p class="muted">Estes não vão pelo Metricool no TikTok. Abra, baixe o vídeo e poste no horário com um som em alta baixinho (5–10%).</p>${mao.slice(0,3).map(slot).join("")}</section>`:"";
  return `${aviso}${kpis}${gravar.some(g=>!g.feito)?`<a class="btn wide" href="#gravar">🎥 ${gravar.filter(g=>!g.feito).length} takes pra gravar →</a>`:""}${blocoMc()}${prox?`<section class="frame hl"><div class="sect"><span class="lbl">Próximo post</span>${pill(prox)}</div>
      <div class="prox"><div style="display:grid;gap:10px">${strip(prox)}</div>
      <div style="display:grid;gap:14px;align-content:start"><div style="display:grid;gap:6px"><span class="when">${ICO.relogio}${quando(prox)}</span><h2>${tit(prox)}</h2><div class="row"><span class="tag">#${esc(prox.num)}</span><span class="tag">${tipo(prox)}</span></div></div>${passos(prox)}</div></div></section>`
    :vazio("Nada na fila","Nenhum post aprovado esperando. Veja a aba Aprovar.")}
    <div class="two"><section class="frame"><div class="sect"><h3>Hoje</h3><span class="muted">${diaLongo(h)}</span></div>${doDia.length?doDia.map(slot).join(""):`<p class="muted">Nada marcado pra hoje.</p>`}</section>
    <section class="frame"><div class="sect"><h3>Amanhã</h3><span class="muted">${diaLongo(amanha)}</span></div>${doAmanha.length?doAmanha.map(slot).join(""):`<p class="muted">Nada marcado pra amanhã.</p>`}</section></div>`;
}
const maoPend=()=>posts.filter(p=>p.postar_a_mao&&p.status!=="publicado"&&p.status!=="negado").sort(byTime);
function telaMao(){
  const pend=maoPend();
  const feitos=posts.filter(p=>p.postar_a_mao&&p.status==="publicado").sort((a,b)=>byTime(b,a));
  const cartao=p=>`<article class="frame${when(p)<Date.now()+6*36e5?" hl":""}"><div class="card"><a href="#post-${esc(p.id)}"><img src="${esc(capa(p))}" alt="Capa do post ${esc(p.num)}"></a>
    <div class="meta"><div class="row">${pill(p)}<span class="tag">#${esc(p.num)}</span></div><h3>${tit(p).replace(/^✋[^·]*·\s*/,"")}</h3><span class="when">${ICO.relogio}${quando(p)} <span class="muted">(Califórnia ${esc(brt5(p.hora))})</span></span>
    ${p.status==="aguardando"?`<p class="muted">Ainda falta você aprovar este.</p>`:""}</div></div>
    <div class="grid2"><a class="btn primary" href="#post-${esc(p.id)}">Abrir e postar</a><button class="ok" data-pub="${esc(p.id)}" ${writable?"":"disabled"}>${ICO.ok}Já postei</button></div></article>`;
  return (pend.length?`<div class="cards2">${pend.map(cartao).join("")}</div>`:vazio("Nada pra postar à mão","Quando um post for só pra você postar no TikTok, ele aparece aqui."))
    +(feitos.length?`<section class="frame lista"><span class="lbl">Já postados à mão</span>${feitos.map(p=>`<div class="slot"><span class="num">#${esc(p.num)}</span><a href="#post-${esc(p.id)}"><span class="row">${pill(p)}<span class="muted">${quando(p)}</span></span><b>${tit(p).replace(/^✋[^·]*·\s*/,"")}</b></a></div>`).join("")}</section>`:"");
}
const brt5=h=>{if(!h)return "";const [a,b]=h.split(":").map(Number);return String((a+19)%24).padStart(2,"0")+":"+String(b).padStart(2,"0")};
function telaAprovar(){
  const pend=posts.filter(p=>p.status==="aguardando").sort(byTime);
  const neg=posts.filter(p=>p.status==="negado");
  return pend.length?`<div class="cards2">${pend.map(cartaoAprovar).join("")}</div>`+(neg.length?`<p class="muted">${neg.length} negado(s) esperando o Claude refazer.</p>`:"")
    :vazio("Nada esperando você",`Quando o Claude terminar um lote novo, os posts aparecem aqui${neg.length?`. ${neg.length} negado(s) estão sendo refeitos`:""}.`);
}
function telaSemana(){
  const h=hoje();let out="";
  for(let i=0;i<7;i++){
    const d=new Date(new Date(h+"T12:00:00-03:00").getTime()+i*864e5).toISOString().slice(0,10);
    const wd=new Date(d+"T12:00:00-03:00").getUTCDay(),fds=wd===0||wd===6;
    const base=fds?["09:00","13:00","17:00","20:30"]:["06:00","12:00","17:00","19:30"];
    const doDia=posts.filter(p=>p.data===d&&p.status!=="negado");
    const horas=[...new Set([...base,...doDia.map(p=>p.hora)])].sort();
    out+=`<section class="frame"><h3>${diaLongo(d)}${i===0?`<span class="hoje-tag">hoje</span>`:""}</h3><div>${horas.map(t=>{const ps=doDia.filter(p=>p.hora===t);
      return ps.length?ps.map(slot).join(""):`<div class="slot"><span class="t">${t}</span><span class="vago">Horário livre</span></div>`}).join("")}</div></section>`;
  }
  return `<div class="semana">${out}</div>`;
}
function telaTodos(){
  const ord=[...posts].sort((a,b)=>byTime(b,a));
  return ord.length?`<section class="frame lista">${ord.map(p=>`<div class="slot"><span class="num">#${esc(p.num)}</span><a href="#post-${esc(p.id)}"><span class="row">${pill(p)}<span class="muted">${quando(p)}</span><span class="tag">${tipo(p)}</span></span><b>${tit(p)}</b></a></div>`).join("")}</section>`
    :vazio("Ainda não há posts","Os posts aparecem aqui assim que o Claude criar.");
}
function telaPost(p){
  if(!p)return `<section class="frame empty"><h2>Post não encontrado</h2><a class="btn" href="#postar">Voltar</a></section>`;
  const neg=negando===p.id;
  return `<a class="btn small back" href="#${esc(voltarLista)}">← Voltar</a>
  <section class="frame"><div class="prox"><div style="display:grid;gap:10px">${p.video?strip(p):`<a href="#fotos-${esc(p.id)}" class="thumbs">${p.slides.map((u,i)=>`<img src="${esc(u)}" alt="Foto ${i+1}" loading="lazy">`).join("")}</a>`}</div>
    <div style="display:grid;gap:12px;align-content:start">${tags(p)}
    <h2>${tit(p)}</h2><span class="when">${ICO.relogio}${quando(p)}</span>
    ${p.status==="negado"&&p.motivo?`<p class="muted"><b>Motivo da recusa:</b> ${esc(p.motivo)}</p>`:""}
    ${p.gancho?`<div style="display:grid;gap:4px"><span class="lbl">Gancho da capa</span><p>${esc(p.gancho)}</p></div>`:""}
    ${p.status==="aguardando"||p.status==="negado"?`<div style="display:grid;gap:8px"><span class="lbl">Sua decisão</span>${neg?formNegar(p):`<div class="grid2"><button class="ok" data-aprovar="${esc(p.id)}" ${writable?"":"disabled"}>${ICO.ok}Aprovar</button>${p.status!=="negado"?`<button class="bad" data-negar-abrir="${esc(p.id)}" ${writable?"":"disabled"}>Negar</button>`:""}</div>`}</div>`:""}
    </div></div></section>
  <div class="two"><section class="frame"><h3>Postar à mão</h3>${passos(p)}</section>
  <div style="display:grid;gap:16px;align-content:start">
  ${p.fontes&&p.fontes.length?`<section class="frame"><span class="lbl">Fontes conferidas</span><ul class="src">${p.fontes.map(f=>`<li><a href="${esc(f)}" target="_blank" rel="noopener">${esc(f.replace(/^https?:\/\//,""))}</a></li>`).join("")}</ul></section>`:""}
  ${p.status!=="aguardando"&&writable?`<button class="small" data-volta="${esc(p.id)}">Voltar pra “aguardando”</button>`:""}</div></div>`;
}
function telaFotos(p){
  if(!p)return telaPost(p);
  return `<a class="btn small back" href="#${esc(voltarFotos||voltarLista)}">← Voltar</a>
  <section class="frame"><h2>Fotos · #${esc(p.num)}</h2>
    <p class="muted"><b>iPhone:</b> segure o dedo em cada foto e toque em <b>Adicionar às Fotos</b>. Salve na ordem, da 1 à ${p.slides.length}.</p>
    ${dl?`<button class="primary wide" data-zip="${esc(p.id)}">Baixar todas de uma vez (.zip)</button>`:""}</section>
  <div class="gal">${p.slides.map((u,i)=>`<figure><img src="${esc(u)}" alt="Foto ${i+1} de ${p.slides.length}"><figcaption><b>${i+1} de ${p.slides.length}</b>${dl?`<button class="small" data-uma="${esc(p.id)}" data-i="${i}">Baixar esta</button>`:""}</figcaption></figure>`).join("")}</div>`;
}

function telaVozes(){
  if(!vozes.length)return vazio("Nenhum teste de voz","Não há teste de voz no momento.");
  const fx=vozes.filter(v=>v.genero==="feminina"),mx=vozes.filter(v=>v.genero!=="feminina");
  const card=v=>`<section class="frame${vozEscolhida===v.id?" hl":""}"><div class="sect"><h3>${esc(v.nome)}</h3>${vozEscolhida===v.id?`<span class="pill s-aprovado">Escolhida</span>`:`<span class="tag">${esc(v.tom||"")}</span>`}</div>
    <audio controls preload="none" src="${esc(v.audio)}" style="width:100%"></audio>
    <p class="muted">${esc(v.duracao)} s · ${esc(String(v.pps).replace(".",","))} palavras/s${v.pps>3?" · <b>rápida demais pra regra (máx. 3,0)</b>":""}${v.obs?` · ${esc(v.obs)}`:""}</p>
    ${vozEscolhida===v.id?"":`<button class="primary" data-voz="${esc(v.id)}" ${writable?"":"disabled"}>Escolher esta voz</button>`}</section>`;
  return `${fx.length?`<h3>Femininas</h3><div class="cards2">${fx.map(card).join("")}</div>`:""}${mx.length?`<h3>Masculinas</h3><div class="cards2">${mx.map(card).join("")}</div>`:""}`;
}
/* ---------- Pra gravar (coleção gravar: titulo, como, pra, ordem, feito, feitoEm) ---------- */
function blocoGravar(){
  const pend=gravar.filter(g=>!g.feito).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const feitos=gravar.filter(g=>g.feito).sort((a,b)=>(b.feitoEm||"").localeCompare(a.feitoEm||""));
  if(!pend.length&&!feitos.length)return "";
  const item=g=>`<div class="grav"><button class="ok" data-gravei="${esc(g.id)}" ${writable?"":"disabled"} aria-label="Marcar como gravado: ${esc(g.titulo)}">${ICO.ok}</button><div style="display:grid;gap:3px"><b>${esc(g.titulo)}</b>${g.como?`<p class="muted">${esc(g.como)}</p>`:""}${g.pra?`<p class="muted" style="font-size:12.5px">Pra quê: ${esc(g.pra)}</p>`:""}</div></div>`;
  return `<section class="frame${pend.length?" hl":""}"><div class="sect"><h3>🎥 Pra gravar</h3><span class="tag">${pend.length?pend.length+" faltando":"tudo gravado"}</span></div>
    ${pend.length?`<p class="muted">Gravou? Toque no ✓ e ele sai da lista. Mande as gravações pra pasta de gravações do Drive.</p><div>${pend.map(item).join("")}</div>`:`<p class="muted">Tudo gravado! 🎉 Quando eu precisar de mais, aparece aqui.</p>`}
    ${feitos.length?`<details><summary class="muted">${feitos.length} já gravado${feitos.length>1?"s":""}</summary>${feitos.map(g=>`<div class="grav feito"><button class="small" data-desgravei="${esc(g.id)}" ${writable?"":"disabled"}>Desfazer</button><span>${esc(g.titulo)}</span></div>`).join("")}</details>`:""}</section>`;
}
/* ---------- Números (coleção metricas: 1 doc por rede e semana + doc 'resumo') ---------- */
const fmt=n=>typeof n==="number"?n.toLocaleString("pt-BR"):esc(n);
function barras(lista,unid){const max=Math.max(...lista.map(x=>+x.valor||0),1);
  return lista.map(x=>`<div class="bar"><div class="sect"><span>${esc(x.nome)}</span><b>${fmt(x.valor)}${esc(unid||"")}</b></div><span class="trk"><i style="width:${Math.max(2,(+x.valor||0)/max*100)}%"></i></span></div>`).join("")}
function telaNumeros(){
  const dados=metricas.filter(m=>m.rede&&m.rede!=="resumo");
  const res=metricas.find(m=>m.rede==="resumo");
  if(!dados.length)return vazio("Ainda sem números","Mande os prints das estatísticas e eu coloco aqui.",ICO.cal);
  const ord=[...dados].sort((a,b)=>(b.data_fim||"").localeCompare(a.data_fim||"")||(a.ordem||0)-(b.ordem||0));
  const ult=ord[0].data_fim;const atuais=ord.filter(m=>m.data_fim===ult),antigos=ord.filter(m=>m.data_fim!==ult);
  const card=m=>`<section class="frame"><div class="sect"><h3>${esc(m.titulo||m.rede)}</h3><span class="tag">${esc(m.periodo||"")}</span></div>
    <div class="kpis">${(m.kpis||[]).map(k=>`<div class="kpi${k.alerta?" alerta":""}"><span>${esc(k.nome)}</span><b>${fmt(k.valor)}</b></div>`).join("")}</div>
    </section>`;
  const lista=(t,xs)=>xs&&xs.length?`<div style="display:grid;gap:6px"><span class="lbl">${esc(t)}</span><ul class="src" style="font-size:14px;display:grid;gap:6px">${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const resumo=res?`<section class="frame hl"><div class="sect"><h3>O que os números dizem</h3><span class="tag">${esc(res.periodo||"")}</span></div>${lista("Leitura",res.leitura)}${lista("O que eu mudo",res.acoes)}${lista("Você pode fazer",res.voce)}${lista("Próximo print",res.falta)}</section>`:"";
  const hist=antigos.length?`<section class="frame lista"><span class="lbl">Semanas anteriores</span>${antigos.map(m=>`<div class="slot"><span class="num">${esc((m.data_fim||"").slice(8,10)+"/"+(m.data_fim||"").slice(5,7))}</span><span><b>${esc(m.titulo||m.rede)}</b><span class="muted"> · ${(m.kpis||[]).slice(0,3).map(k=>`${esc(k.nome)}: ${fmt(k.valor)}`).join(" · ")}</span></span></div>`).join("")}</section>`:"";
  return `<div class="two">${atuais.map(card).join("")}</div>`;
}
function render(){
  const h=(location.hash||"#postar").slice(1);
  const [v,...rest]=h.split("-");const id=rest.join("-");
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const pend=posts.filter(p=>p.status==="aguardando").length;const n=$("#n-aprovar");n.hidden=!pend;n.textContent=pend;
  const nm=gravar.filter(g=>!g.feito).length;const n2=$("#n-gravar");n2.hidden=!nm;n2.textContent=nm;
  const [tt,st]=TITULOS[v]||TITULOS.postar;
  $("#phead").innerHTML=v==="post"||v==="fotos"?"":`<div><h1>${tt}</h1><p>${st}</p></div>`;
  $("#phead").hidden=v==="post"||v==="fotos";
  if(!loaded)return;
  const el=$("#view");
  el.innerHTML=v==="aprovar"?telaAprovar():v==="semana"?telaSemana():v==="todos"?telaTodos():v==="gravar"?(blocoGravar()||vazio("Nada pra gravar","Quando eu precisar de uma gravação, ela aparece aqui.")):v==="mao"?telaMao():v==="post"?telaPost(get(id)):v==="fotos"?telaFotos(get(id)):v==="vozes"?telaVozes():v==="numeros"?telaNumeros():telaPostar();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.copy){const p=get(d.id);copiar(d.copy==="legenda"?p.legenda:p.fixado,t)}
  else if(d.zip){baixarZip(get(d.zip),t)}
  else if(d.vid){baixarVideo(get(d.vid),t)}
  else if(d.uma){baixarUma(get(d.uma),+d.i,t)}
  else if(d.aprovar){negando=null;const pid=d.aprovar;salvar(pid,{status:"aprovado",motivo:""},"Aprovado ✓").then(()=>{const p=get(pid);if(p)entregarDrive({...p,status:"aprovado"})})}
  else if(d.negarAbrir){negando=d.negarAbrir;render()}
  else if(d.negarCancelar){negando=null;render()}
  else if(d.negar){
    const id=d.negar;const ms=[...document.querySelectorAll(`input[id^="m-${CSS.escape(id)}-"]:checked`)].map(i=>i.value);const tx=($("#txt-"+CSS.escape(id))||{}).value?.trim()||"";
    if(!ms.length&&!tx){toast("Marque um motivo ou escreva o que mudar");return}
    negando=null;salvar(id,{status:"negado",motivo:[...ms,tx].filter(Boolean).join(" · ")},"Recusado. O Claude vai refazer.")}
  else if(d.voz){if(!db)return;vozEscolhida=d.voz;render();db.collection("config").doc("voz").set({escolhida:d.voz,em:new Date().toISOString()}).then(()=>toast("Voz escolhida! O Claude vai usar essa nos vídeos"),()=>toast("Não salvou. Tente de novo."))}
  else if(d.gravei){if(!db||!writable)return;db.collection("gravar").doc(d.gravei).update({feito:true,feitoEm:new Date().toISOString()}).then(()=>toast("Boa! Saiu da lista ✓"),()=>toast("Não salvou. Tente de novo."))}
  else if(d.desgravei){if(!db||!writable)return;db.collection("gravar").doc(d.desgravei).update({feito:false}).then(()=>toast("Voltou pra lista"),()=>toast("Não salvou. Tente de novo."))}
  else if(d.mc){carregarMc(true)}
  else if(d.perm){claude.use("permissions").then(p=>p&&p.manage()).catch(()=>toast("Abra o menu Permissões do painel"))}
  else if(d.agendar){salvar(d.agendar,{status:"agendado"},"Marcado como agendado no Metricool")}
  else if(d.pub){salvar(d.pub,{status:"publicado"},"Marcado como postado 🎉")}
  else if(d.volta){salvar(d.volta,{status:"aguardando"},"Voltou pra aguardando")}
});
addEventListener("hashchange",e=>{negando=null;
  const antes=(new URL(e.oldURL).hash||"#postar").slice(1);const agora=location.hash.slice(1);
  if(!/^(post|fotos)-/.test(antes))voltarLista=antes;
  if(/^fotos-/.test(agora))voltarFotos=antes;
  render();scrollTo(0,0)});

(async()=>{
  render();
  claude.use("downloads").then(x=>{dl=x;if(loaded)render()}).catch(()=>{});
  claude.use("mcp").then(x=>{mcp=x;carregarMc(false)}).catch(()=>{mc={fase:"sem"};render()});
  db=await claude.use("db").catch(()=>null);
  if(!db){$("#view").innerHTML=vazio("Entre na sua conta","Abra este painel logada no claude.ai pra ver e aprovar os posts.");return}
  const timer=setTimeout(()=>{if(!loaded)$("#view").innerHTML=`<section class="frame empty muted">Ainda conectando… confira a internet.</section>`},10000);
  db.collection("gravar").onSnapshot(sn=>{gravar=sn.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("metricas").onSnapshot(sn=>{metricas=sn.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("vozes").onSnapshot(sn=>{vozes=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ordem||0)-(b.ordem||0));render()},()=>{});
  db.collection("config").doc("voz").onSnapshot(sn=>{vozEscolhida=sn.exists?sn.data().escolhida:null;render()},()=>{});
  db.collection("posts").onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(timer);
    posts=snap.docs.map(d=>({id:d.id,slides:[],...d.data()}));loaded=true;render();
  },()=>{clearTimeout(timer);loaded=true;$("#view").innerHTML=`<section class="frame empty muted">Não deu pra carregar os posts. Abra o painel de novo daqui a pouco.</section>`});
})();
</script>

</body></html>
